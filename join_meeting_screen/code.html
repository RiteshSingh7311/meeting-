<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ConnectPro - Join Meeting</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#eeefff",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#213145",
                        "surface-container-low": "#eff4ff",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary-container": "#bdffdb",
                        "on-surface": "#0b1c30",
                        "secondary-container": "#dae2fd",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#002113",
                        "background": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "primary": "#004ac6",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#d3e4fe",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-primary-fixed": "#00174b",
                        "tertiary-fixed": "#6ffbbe",
                        "tertiary": "#006242",
                        "surface-bright": "#f8f9ff",
                        "tertiary-fixed-dim": "#4edea3",
                        "secondary": "#565e74",
                        "primary-container": "#2563eb",
                        "on-secondary-container": "#5c647a",
                        "surface": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-container": "#007d55",
                        "on-secondary-fixed": "#131b2e",
                        "surface-variant": "#d3e4fe",
                        "error-container": "#ffdad6",
                        "outline": "#737686",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "on-secondary-fixed-variant": "#3f465c",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#434655",
                        "primary-fixed": "#dbe1ff",
                        "on-background": "#0b1c30",
                        "surface-dim": "#cbdbf5",
                        "surface-container": "#e5eeff",
                        "on-primary-fixed-variant": "#003ea8",
                        "secondary-fixed": "#dae2fd",
                        "surface-tint": "#0053db",
                        "secondary-fixed-dim": "#bec6e0",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-sm": "8px",
                        "unit": "4px",
                        "stack-gap-md": "16px",
                        "grid-columns": "4",
                        "grid-gutter": "16px",
                        "container-padding": "20px",
                        "stack-gap-lg": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "title-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .gradient-text {
            background: linear-gradient(135deg, #004ac6, #00174b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface/70 backdrop-blur-xl border-b border-outline-variant/10 shadow-[0_4px_20px_rgba(0,74,198,0.04)] flex justify-between items-center px-container-padding py-stack-gap-sm">
<div class="flex items-center gap-stack-gap-sm">
<img class="w-10 h-10 rounded-full object-cover" data-alt="A professional headshot of a corporate user in a modern office environment. Soft natural lighting, shallow depth of field, high-end corporate aesthetic. The overall mood is confident and polished." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0q73iYclNFThuDymGX7awStY_UkB895YPghzyegjNAYK5UG38ilu-FYVe7REauO3f9hzE2cqyun5uLOwsuGfAZEJYMnM5-YBaCWd8tj-yUmGgRYlyK7jNpn3FbOz1qQeIaN4poqgLrfKP0WqWzO6fSEwk_uZLebtN8ZE2U2AkRdlTjyqqVyxJXJRk219TmX-KRIc14Yi0EfuWSrp92P2627iMPjXlR1TLK2DejLuPSwNcPlJkPieplJMzYH_5V9jvDjj2Ns3IHt4"/>
</div>
<div class="font-headline-md text-headline-md font-bold text-primary">
            ConnectPro
        </div>
<button class="p-2 rounded-full hover:bg-surface-container-high/50 active:scale-95 duration-200 transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="search">search</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-container-padding py-stack-gap-lg">
<div class="w-full max-w-sm glass-panel rounded-[24px] p-stack-gap-lg shadow-[0_4px_30px_rgba(0,74,198,0.08)] flex flex-col gap-stack-gap-lg relative overflow-hidden">
<!-- Decorative background element -->
<div class="absolute -top-20 -right-20 w-40 h-40 bg-primary/10 rounded-full blur-2xl pointer-events-none"></div>
<div class="text-center z-10">
<span class="material-symbols-outlined text-primary mb-stack-gap-sm" data-icon="video_call" data-weight="fill" style="font-size: 48px;">video_call</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-unit">Join a Meeting</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the code or link provided by the host.</p>
</div>
<div class="flex flex-col gap-stack-gap-md z-10 w-full">
<!-- Input Group -->
<div class="relative group w-full">
<input class="w-full h-14 pl-4 pr-24 bg-surface rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary font-body-lg text-body-lg text-on-surface outline-none transition-all placeholder:text-outline" id="meetingCode" placeholder="e.g. abc-defg-hij" type="text"/>
<div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1">
<button aria-label="Paste" class="p-2 rounded-lg hover:bg-surface-container-high transition-colors text-on-surface-variant flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="content_paste">content_paste</span>
</button>
<button aria-label="Scan QR" class="p-2 rounded-lg hover:bg-surface-container-high transition-colors text-primary flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="qr_code_scanner">qr_code_scanner</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-gradient-to-b from-primary to-[#003ea8] text-on-primary font-title-md text-title-md rounded-[16px] shadow-sm hover:shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button">
<span>Join Meeting</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<div class="flex items-center justify-center gap-2 mt-2 z-10">
<div class="h-[1px] bg-outline-variant/30 flex-1"></div>
<span class="font-label-md text-label-md text-on-surface-variant px-2">OR</span>
<div class="h-[1px] bg-outline-variant/30 flex-1"></div>
</div>
<button class="w-full h-12 border-2 border-outline-variant text-primary font-title-md text-title-md rounded-[16px] hover:bg-primary/5 active:scale-[0.98] transition-all flex items-center justify-center gap-2 z-10" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
<span>Start an Instant Meeting</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-4 pt-2 bg-surface/80 backdrop-blur-xl border-t border-outline-variant/10 shadow-[0_-4px_20px_rgba(0,74,198,0.04)] rounded-t-xl z-50">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-low transition-all active:scale-90 duration-150 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-3 py-1 hover:bg-surface-container-low transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined mb-1" data-icon="video_chat" data-weight="fill">video_chat</span>
<span class="font-label-md text-label-md">Meetings</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-low transition-all active:scale-90 duration-150 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="calendar_today">calendar_today</span>
<span class="font-label-md text-label-md">Calendar</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-low transition-all active:scale-90 duration-150 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="notifications">notifications</span>
<span class="font-label-md text-label-md">Alerts</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-low transition-all active:scale-90 duration-150 rounded-xl">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button>
</nav>
<script>
        // Simple micro-interaction for input field
        const input = document.getElementById('meetingCode');
        input.addEventListener('focus', () => {
            input.parentElement.classList.add('scale-[1.02]');
        });
        input.addEventListener('blur', () => {
            input.parentElement.classList.remove('scale-[1.02]');
        });
    </script>
</body></html>
