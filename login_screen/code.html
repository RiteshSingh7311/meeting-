<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ConnectPro - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#eeefff",

                        "inverse-surface": "#213145",

                        "on-surface": "#0b1c30",

                        "on-tertiary-fixed": "#002113",
                        "background": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "primary": "#004ac6",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#d3e4fe",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-primary-fixed": "#00174b",
                        "tertiary-fixed": "#6ffbbe",
                        "tertiary": "#006242",
                        "surface-bright": "#f8f9ff",
                        "tertiary-fixed-dim": "#4edea3",
                        "secondary": "#565e74",
                        "primary-container": "#2563eb",
                        "on-secondary-container": "#5c647a",
                        "surface": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-container": "#007d55",
                        "on-secondary-fixed": "#131b2e",
                        "surface-variant": "#d3e4fe",
                        "error-container": "#ffdad6",
                        "outline": "#737686",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "on-secondary-fixed-variant": "#3f465c",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#434655",
                        "primary-fixed": "#dbe1ff",
                        "on-background": "#0b1c30",
                        "surface-dim": "#cbdbf5",
                        "surface-container": "#e5eeff",
                        "on-primary-fixed-variant": "#003ea8",
                        "secondary-fixed": "#dae2fd",
                        "surface-tint": "#0053db",
                        "secondary-fixed-dim": "#bec6e0",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1rem"
                    },
                    "spacing": {
                        "stack-gap-sm": "8px",
                        "unit": "4px",
                        "stack-gap-md": "16px",
                        "grid-columns": "4",
                        "grid-gutter": "16px",
                        "container-padding": "20px",
                        "stack-gap-lg": "24px",
                        "14": "3.5rem"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],

                    },
                    "fontSize": {

                }
            }

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px rgba(0, 74, 198, 0.04);
        }
        
        .bg-gradient-primary {
            background: linear-gradient(180deg, #004ac6 0%, #003ea8 100%);
        }
        
        input:focus + label,
        input:not(:placeholder-shown) + label {
            transform: translateY(-24px) scale(0.85);
            background-color: white;
            padding: 0 4px;
            color: #004ac6;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center font-sans antialiased overflow-hidden relative">
<!-- Ambient Background Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container opacity-10 blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-container opacity-20 blur-[80px] pointer-events-none"></div>
<main class="w-full max-w-[440px] px-container-padding z-10">
<!-- Branding Header -->
<div class="text-center mb-stack-gap-lg">
<div class="w-16 h-16 bg-gradient-primary rounded-2xl flex items-center justify-center mx-auto mb-stack-gap-sm shadow-md">
<span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">
                    hub
                </span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">ConnectPro</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-unit">Welcome back to your workspace</p>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-2xl p-stack-gap-lg">
<form action="#" class="space-y-stack-gap-md" method="POST">
<!-- Email Input -->
<div class="relative">
<input class="peer block w-full rounded-2xl border-outline-variant bg-transparent px-4 pb-2 pt-6 font-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors h-14" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="absolute left-4 top-4 font-body-lg text-on-surface-variant transition-all duration-200 pointer-events-none origin-[0_0] text-sm" for="email">Email Address</label>
</div>
<!-- Password Input -->
<div class="relative">
<input class="peer block w-full rounded-2xl border-outline-variant bg-transparent px-4 pb-2 pt-6 font-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors h-14" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="absolute left-4 top-4 font-body-lg text-on-surface-variant transition-all duration-200 pointer-events-none origin-[0_0] text-sm" for="password">Password</label>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">
                            visibility_off
                        </span>
</button>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between py-unit">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary bg-transparent" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-body-md text-body-md font-medium text-primary hover:text-primary-fixed-variant transition-colors" href="#">
                            Forgot Password?
                        </a>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-gradient-primary text-on-primary font-title-md text-title-md rounded-2xl h-14 flex items-center justify-center hover:opacity-90 transition-opacity active:scale-[0.98] shadow-sm" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="mt-stack-gap-md mb-stack-gap-md flex items-center justify-center">
<div class="h-px w-full bg-outline-variant opacity-30"></div>
<span class="px-3 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">or</span>
<div class="h-px w-full bg-outline-variant opacity-30"></div>
</div>
<!-- Social Login & Biometrics -->
<div class="flex gap-stack-gap-sm">
<!-- Google Button -->
<button class="flex-1 flex items-center justify-center gap-2 border border-outline-variant rounded-2xl h-12 bg-surface-container-lowest hover:bg-surface-container-low transition-colors font-body-md text-body-md font-medium text-on-surface" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
<!-- Biometric Button -->
<button aria-label="Biometric Login" class="w-12 h-12 flex-shrink-0 flex items-center justify-center border border-outline-variant rounded-2xl bg-surface-container-lowest hover:bg-surface-container-low transition-colors text-primary" type="button">
<span class="material-symbols-outlined">
                        fingerprint
                    </span>
</button>
</div>
</div>
<!-- Footer Links -->
<div class="mt-stack-gap-lg text-center font-body-md text-body-md text-on-surface-variant">
            Don't have an account? <a class="font-medium text-primary hover:text-primary-fixed-variant transition-colors" href="#">Sign up</a>
</div>
</main>
</body></html>
