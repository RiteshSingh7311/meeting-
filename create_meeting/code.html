<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Meeting - ConnectPro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-container": "#eeefff",
                    "on-secondary": "#ffffff",
                    "inverse-surface": "#213145",
                    "surface-container-low": "#eff4ff",
                    "outline-variant": "#c3c6d7",
                    "on-tertiary-container": "#bdffdb",
                    "on-surface": "#0b1c30",
                    "secondary-container": "#dae2fd",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed": "#002113",
                    "background": "#f8f9ff",
                    "surface-container-high": "#dce9ff",
                    "primary": "#004ac6",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#d3e4fe",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-tertiary-fixed-variant": "#005236",
                    "on-primary-fixed": "#00174b",
                    "tertiary-fixed": "#6ffbbe",
                    "tertiary": "#006242",
                    "surface-bright": "#f8f9ff",
                    "tertiary-fixed-dim": "#4edea3",
                    "secondary": "#565e74",
                    "primary-container": "#2563eb",
                    "on-secondary-container": "#5c647a",
                    "surface": "#f8f9ff",
                    "inverse-on-surface": "#eaf1ff",
                    "tertiary-container": "#007d55",
                    "on-secondary-fixed": "#131b2e",
                    "surface-variant": "#d3e4fe",
                    "error-container": "#ffdad6",
                    "outline": "#737686",
                    "surface-container-lowest": "#ffffff",
                    "inverse-primary": "#b4c5ff",
                    "on-secondary-fixed-variant": "#3f465c",
                    "on-tertiary": "#ffffff",
                    "on-surface-variant": "#434655",
                    "primary-fixed": "#dbe1ff",
                    "on-background": "#0b1c30",
                    "surface-dim": "#cbdbf5",
                    "surface-container": "#e5eeff",
                    "on-primary-fixed-variant": "#003ea8",
                    "secondary-fixed": "#dae2fd",
                    "surface-tint": "#0053db",
                    "secondary-fixed-dim": "#bec6e0",
                    "error": "#ba1a1a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px",
                    "2xl": "1.5rem"
            },
            "spacing": {
                    "stack-gap-sm": "8px",
                    "unit": "4px",
                    "stack-gap-md": "16px",
                    "grid-columns": "4",
                    "grid-gutter": "16px",
                    "container-padding": "20px",
                    "stack-gap-lg": "24px",
                    "stack-gap-xl": "32px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg-mobile": ["Inter"],
                    "title-lg": ["Inter"],
                    "display-lg": ["Inter"],
                    "title-md": ["Inter"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "22px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "26px", "fontWeight": "400"}],
                    "display-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "title-md": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 30px rgba(0, 74, 198, 0.05);
        }

        .primary-gradient-btn {
            background: linear-gradient(180deg, theme('colors.primary') 0%, theme('colors.on-primary-fixed-variant') 100%);
        }
        
        /* Form Field Styles */
        .form-input {
            width: 100%;
            background-color: theme('colors.surface-container-lowest');
            border: 1px solid theme('colors.outline-variant');
            border-radius: theme('borderRadius.lg');
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: theme('colors.on-surface');
            transition: all 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 2px theme('colors.primary-fixed');
        }
        
        .form-input::placeholder {
            color: theme('colors.outline');
        }

        .form-label {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: theme('colors.on-surface');
            margin-bottom: 8px;
        }
        
        .radio-group {
            display: flex;
            gap: 16px;
        }
        
        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: theme('colors.on-surface');
        }
        
        .radio-input {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid theme('colors.outline-variant');
            border-radius: 50%;
            display: grid;
            place-content: center;
            transition: all 0.2s ease;
        }
        
        .radio-input::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em theme('colors.primary');
        }
        
        .radio-input:checked {
            border-color: theme('colors.primary');
        }
        
        .radio-input:checked::before {
            transform: scale(1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-[80px] md:pb-0 md:pt-[72px]">
<!-- TopAppBar (Web & Mobile Context aware) -->
<!-- Suppressed on Mobile as this is a linear task flow, but we provide a header for the canvas -->
<header class="w-full sticky top-0 z-50 bg-surface/70 dark:bg-on-surface/70 backdrop-blur-xl border-b border-outline-variant/10 shadow-[0_4px_20px_rgba(0,74,198,0.04)] hidden md:block">
<div class="flex justify-between items-center px-container-padding py-stack-gap-sm w-full">
<div class="flex items-center gap-4">
<a class="text-on-surface-variant hover:bg-surface-container-high/50 p-2 rounded-full transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</a>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">ConnectPro</h1>
</div>
<div class="hidden md:flex items-center gap-8">
<!-- Main Nav omitted as this is a creation flow -->
</div>
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-outline-variant/20">
<img alt="User Profile Photo" class="w-full h-full object-cover" data-alt="A professional headshot of a diverse corporate executive in a modern, brightly lit office environment. Minimalist background, professional attire." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJLXLj7xE_gdvlLrvNHTdN2JBN5xwbcWcYo5BxEg7B0m1zVea-35DQJ-maGKadKxGZMJCfOD2pd7dJpyutbvWGyDpDTWD7vMXd_yPBOh39q8BgllWcmIF67M2lHgFMGaXxXb4ruhcEuHKN5UzHV1S-sh5Ydk7syS7PwSe8AWXNfZlre0oPOCgsFfpC8c1rBUkzAm4PjL3sXKQFUACnOaiY0wD0-jRzkKiSHwyY6a6YNBnDGHmJ311uYIKjRuTENY5av8DeAJ-niOQ"/>
</div>
</div>
</div>
</header>
<!-- Mobile Header (Linear Flow) -->
<header class="md:hidden w-full sticky top-0 z-40 bg-surface/90 backdrop-blur-md px-container-padding py-4 flex items-center gap-4">
<a class="text-on-surface p-2 -ml-2 rounded-full active:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined">close</span>
</a>
<h2 class="font-title-lg text-title-lg text-on-surface">New Meeting</h2>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[800px] mx-auto px-container-padding py-stack-gap-lg">
<div class="hidden md:block mb-stack-gap-xl">
<h2 class="font-display-lg text-display-lg text-on-surface">Create New Meeting</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2">Set up your virtual room and invite participants.</p>
</div>
<div class="glass-panel rounded-2xl p-6 md:p-8 space-y-stack-gap-xl">
<!-- Basic Info Section -->
<section class="space-y-stack-gap-md">
<div>
<label class="form-label" for="meetingTitle">Meeting Title</label>
<input class="form-input" id="meetingTitle" placeholder="e.g. Q3 Roadmap Review" type="text"/>
</div>
<div>
<label class="form-label" for="meetingDesc">Description (Optional)</label>
<textarea class="form-input min-h-[100px] resize-y" id="meetingDesc" placeholder="Briefly describe the agenda or purpose of this meeting..."></textarea>
</div>
</section>
<hr class="border-outline-variant/20"/>
<!-- Scheduling Section (Bento-style layout on desktop) -->
<section>
<h3 class="font-title-md text-title-md text-on-surface mb-stack-gap-md">Schedule</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-grid-gutter">
<div>
<label class="form-label" for="meetingDate">Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">calendar_today</span>
<input class="form-input pl-12" id="meetingDate" type="date"/>
</div>
</div>
<div>
<label class="form-label" for="meetingTime">Start Time</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">schedule</span>
<input class="form-input pl-12" id="meetingTime" type="time"/>
</div>
</div>
<div class="md:col-span-2">
<label class="form-label" for="meetingDuration">Duration</label>
<div class="relative">
<select class="form-input appearance-none" id="meetingDuration">
<option value="15">15 Minutes</option>
<option selected="" value="30">30 Minutes</option>
<option value="45">45 Minutes</option>
<option value="60">1 Hour</option>
<option value="90">1.5 Hours</option>
<option value="120">2 Hours</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
</div>
</section>
<hr class="border-outline-variant/20"/>
<!-- Access & Security Section -->
<section>
<h3 class="font-title-md text-title-md text-on-surface mb-stack-gap-md">Access &amp; Security</h3>
<div class="space-y-stack-gap-lg">
<!-- Privacy Toggle -->
<div class="flex items-start justify-between bg-surface-container-low p-4 rounded-xl border border-outline-variant/30">
<div>
<span class="font-title-md text-title-md text-on-surface block">Meeting Privacy</span>
<span class="font-body-md text-body-md text-on-surface-variant">Control who can join this meeting.</span>
</div>
<div class="radio-group flex-col md:flex-row mt-2 md:mt-0">
<label class="radio-label">
<input class="radio-input" name="privacy" type="radio" value="public"/>
<span>Public (Open Link)</span>
</label>
<label class="radio-label">
<input checked="" class="radio-input" name="privacy" type="radio" value="private"/>
<span>Private (Invite Only)</span>
</label>
</div>
</div>
<!-- Quick Actions -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap-sm">
<button class="flex items-center justify-center gap-2 py-3 px-4 border border-outline-variant rounded-xl font-title-md text-title-md text-on-surface hover:bg-surface-container-low transition-colors w-full" type="button">
<span class="material-symbols-outlined">link</span>
                            Generate Code
                        </button>
<button class="flex items-center justify-center gap-2 py-3 px-4 border border-outline-variant rounded-xl font-title-md text-title-md text-on-surface hover:bg-surface-container-low transition-colors w-full" type="button">
<span class="material-symbols-outlined">person_add</span>
                            Invite Participants
                        </button>
</div>
</div>
</section>
</div>
<!-- Sticky Bottom Action (Mobile) / Regular Action (Desktop) -->
<div class="fixed md:static bottom-0 left-0 w-full md:w-auto bg-surface/90 md:bg-transparent backdrop-blur-md md:backdrop-blur-none p-4 md:p-0 md:pt-stack-gap-lg border-t border-outline-variant/20 md:border-t-0 flex justify-end gap-stack-gap-sm z-30">
<button class="hidden md:block py-3 px-6 rounded-xl font-title-md text-title-md text-primary border-2 border-primary hover:bg-primary/5 transition-colors" type="button">
                Cancel
            </button>
<button class="w-full md:w-auto primary-gradient-btn py-3 px-8 rounded-xl font-title-md text-title-md text-on-primary shadow-lg active:scale-95 transition-transform" type="submit">
                Create Meeting
            </button>
</div>
</main>
<!-- Navigation omitted due to linear flow (creation task), as per guidelines -->
</body></html>
