<!-- Camera Control -->
<div class="flex flex-col items-center gap-1">
<button class="w-12 h-12 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center hover:bg-surface-container-highest transition-all shadow-sm border border-outline-variant/20">

<span class="material-symbols-outlined">pan_tool</span>
</button>

<span class="material-symbols-outlined">more_vert</span>
</button>
<div class="w-px h-8 bg-outline-variant/30 mx-2"></div>

<button class="h-12 px-6 rounded-full bg-error text-on-error flex items-center gap-2 hover:bg-error/90 transition-all font-title-md text-title-md shadow-md">
