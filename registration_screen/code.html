<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registration - ConnectPro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#eeefff",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#213145",
                        "surface-container-low": "#eff4ff",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary-container": "#bdffdb",
                        "on-surface": "#0b1c30",
                        "secondary-container": "#dae2fd",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#002113",
                        "background": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "primary": "#004ac6",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#d3e4fe",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-primary-fixed": "#00174b",
                        "tertiary-fixed": "#6ffbbe",
                        "tertiary": "#006242",
                        "surface-bright": "#f8f9ff",
                        "tertiary-fixed-dim": "#4edea3",
                        "secondary": "#565e74",
                        "primary-container": "#2563eb",
                        "on-secondary-container": "#5c647a",
                        "surface": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-container": "#007d55",
                        "on-secondary-fixed": "#131b2e",
                        "surface-variant": "#d3e4fe",
                        "error-container": "#ffdad6",
                        "outline": "#737686",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "on-secondary-fixed-variant": "#3f465c",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#434655",
                        "primary-fixed": "#dbe1ff",
                        "on-background": "#0b1c30",
                        "surface-dim": "#cbdbf5",
                        "surface-container": "#e5eeff",
                        "on-primary-fixed-variant": "#003ea8",
                        "secondary-fixed": "#dae2fd",
                        "surface-tint": "#0053db",
                        "secondary-fixed-dim": "#bec6e0",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-sm": "8px",
                        "unit": "4px",
                        "stack-gap-md": "16px",
                        "grid-columns": "4",
                        "grid-gutter": "16px",
                        "container-padding": "20px",
                        "stack-gap-lg": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],

                    "fontSize": {

<style>
        body {
            background-color: #f8f9ff;
            color: #0b1c30;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(195, 198, 215, 0.3);
            box-shadow: 0 4px 20px rgba(0, 74, 198, 0.04);
        }
        
        /* Material 3 Outlined Input Style */
        .md3-input-container {
            position: relative;
            margin-bottom: 24px;
        }
        .md3-input {
            width: 100%;
            padding: 16px;
            background: transparent;
            border: 1px solid #737686;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 26px;
            color: #0b1c30;
            transition: all 0.2s ease;
            outline: none;
        }
        .md3-input:focus {
            border-color: #004ac6;
            border-width: 2px;
            padding: 15px; /* Adjust padding to prevent jumping when border thickens */
        }
        .md3-label {
            position: absolute;
            left: 16px;
            top: 16px;
            color: #434655;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 26px;
            pointer-events: none;
            transition: all 0.2s ease;
            background-color: transparent;
            padding: 0 4px;
        }
        .md3-input:focus ~ .md3-label,
        .md3-input:not(:placeholder-shown) ~ .md3-label {
            top: -10px;
            left: 12px;
            font-size: 12px;
            line-height: 16px;
            color: #004ac6;
            background: linear-gradient(180deg, rgba(255,255,255,0) 50%, white 50%);
            /* Hack to make label background look right on glass card */
            background-color: white;
            border-radius: 4px;
        }
        .md3-input:not(:focus):not(:placeholder-shown) ~ .md3-label {
            color: #434655;
        }
        
        .btn-primary {
            background: linear-gradient(180deg, #004ac6 0%, #003ea8 100%);
            color: white;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex items-center justify-center p-container-padding antialiased">
<!-- Decorative Background Elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
<div class="absolute -top-[20%] -left-[10%] w-[70%] h-[70%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute top-[40%] -right-[20%] w-[60%] h-[60%] rounded-full bg-tertiary/5 blur-[100px]"></div>
</div>
<!-- Registration Card -->
<main class="w-full max-w-md glass-card rounded-2xl p-8 sm:p-10 relative overflow-hidden">
<!-- Header -->
<div class="mb-stack-gap-lg text-center">
<h1 class="font-headline-md text-headline-md text-primary font-bold mb-stack-gap-sm tracking-tight">ConnectPro</h1>
<h2 class="font-title-lg text-title-lg text-on-surface mb-2">Create an Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join the modern workspace for professionals.</p>
</div>
<!-- Form -->
<form action="#" class="w-full" method="POST">
<div class="md3-input-container">
<input class="md3-input" id="fullName" name="fullName" placeholder=" " required="" type="text"/>
<label class="md3-label" for="fullName">Full Name</label>
</div>
<div class="md3-input-container">
<input class="md3-input" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="md3-label" for="email">Email Address</label>
</div>
<div class="md3-input-container">
<input class="md3-input" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="md3-label" for="password">Password</label>
</div>
<div class="md3-input-container">
<input class="md3-input" id="confirmPassword" name="confirmPassword" placeholder=" " required="" type="password"/>
<label class="md3-label" for="confirmPassword">Confirm Password</label>
</div>
<button class="w-full btn-primary rounded-[16px] py-4 font-title-md text-title-md flex items-center justify-center gap-2 mt-stack-gap-md shadow-[0_4px_12px_rgba(0,74,198,0.15)]" type="submit">
                Create Account
                <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-stack-gap-lg text-center font-body-md text-body-md">
<span class="text-on-surface-variant">Already have an account?</span>
<a class="text-primary font-medium hover:underline ml-1" href="#">Log in</a>
</div>
</main>
</body></html>
