<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ConnectPro - Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#eeefff",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#213145",
                        "surface-container-low": "#eff4ff",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary-container": "#bdffdb",
                        "on-surface": "#0b1c30",
                        "secondary-container": "#dae2fd",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#002113",
                        "background": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "primary": "#004ac6",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#d3e4fe",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-primary-fixed": "#00174b",
                        "tertiary-fixed": "#6ffbbe",
                        "tertiary": "#006242",
                        "surface-bright": "#f8f9ff",
                        "tertiary-fixed-dim": "#4edea3",
                        "secondary": "#565e74",
                        "primary-container": "#2563eb",
                        "on-secondary-container": "#5c647a",
                        "surface": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-container": "#007d55",
                        "on-secondary-fixed": "#131b2e",
                        "surface-variant": "#d3e4fe",
                        "error-container": "#ffdad6",
                        "outline": "#737686",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "on-secondary-fixed-variant": "#3f465c",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#434655",
                        "primary-fixed": "#dbe1ff",
                        "on-background": "#0b1c30",
                        "surface-dim": "#cbdbf5",
                        "surface-container": "#e5eeff",
                        "on-primary-fixed-variant": "#003ea8",
                        "secondary-fixed": "#dae2fd",
                        "surface-tint": "#0053db",
                        "secondary-fixed-dim": "#bec6e0",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-sm": "8px",
                        "unit": "4px",
                        "stack-gap-md": "16px",
                        "grid-columns": "4",
                        "grid-gutter": "16px",
                        "container-padding": "20px",
                        "stack-gap-lg": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],

                    },
                    "fontSize": {

                        "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],

                }
            }
        }

<style>
        .loader-ring {
            border: 3px solid transparent;
            border-top-color: #004ac6; /* primary */
            border-right-color: #b4c5ff; /* primary-fixed-dim */
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .pulse-logo {
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 10px rgba(0,74,198,0.2)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 25px rgba(0,74,198,0.6)); transform: scale(1.02); }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background antialiased h-screen w-full flex flex-col items-center justify-center relative overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Effects (Glassmorphism / Tonal Layers) -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-surface-variant rounded-full blur-[100px] opacity-40"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-primary-fixed-dim rounded-full blur-[120px] opacity-30"></div>
<div class="absolute top-[40%] left-[60%] w-[30%] h-[30%] bg-secondary-container rounded-full blur-[80px] opacity-40"></div>
</div>
<!-- Main Content Canvas -->
<main class="z-10 flex flex-col items-center justify-between h-full w-full py-[88px] px-container-padding max-w-md mx-auto">
<!-- Top Spacer -->
<div class="flex-1"></div>
<!-- Center Brand Cluster -->
<div class="flex flex-col items-center justify-center flex-none fade-in-up">
<!-- Brand Logo Mark -->
<div class="relative flex items-center justify-center w-24 h-24 mb-stack-gap-lg pulse-logo bg-surface-container-lowest rounded-2xl shadow-[0_4px_30px_rgba(0,74,198,0.15)] border border-outline-variant/20 backdrop-blur-md">
<span class="material-symbols-outlined text-primary text-[48px] font-[200]" style="font-variation-settings: 'FILL' 1;">
                    connect_without_contact
                </span>
<!-- Subtle internal reflection -->
<div class="absolute inset-0 rounded-2xl border-t border-white/60 pointer-events-none"></div>
</div>
<!-- Brand Typography -->
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface text-center mb-stack-gap-sm tracking-tight">
                ConnectPro
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[240px] opacity-80">
                Enterprise collaboration, simplified.
            </p>
</div>
<!-- Bottom Loading Cluster -->
<div class="flex flex-col items-center justify-end flex-1 w-full pb-stack-gap-lg fade-in-up" style="animation-delay: 0.3s;">
<!-- Custom Material 3 style indeterminate loader -->
<div class="relative w-12 h-12 flex items-center justify-center mb-stack-gap-md">
<div class="absolute inset-0 loader-ring"></div>
<!-- Optional inner dot for extra polish -->
<div class="w-2 h-2 bg-primary rounded-full animate-pulse"></div>
</div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest opacity-70">
                Initializing Workspace...
            </span>
</div>
</main>
<!-- Navigation Shell suppressed as per intent rules (Linear/Transactional) -->
</body></html>
